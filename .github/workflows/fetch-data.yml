name: Fetch data

# Runs the download scripts on GitHub's servers and commits the (small, aggregated)
# results to data/fetched/. Start it from the Actions tab: "Fetch data" -> "Run workflow".

on:
  workflow_dispatch:
    inputs:
      parts:
        description: "download_data.py parts to run after step 1 (space-separated, or 'none')"
        required: false
        default: "licenses mpg"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Step 1 - TNP vehicles (powertrain mix + trips per vehicle)
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          mkdir -p data/fetched
          python src/step1_tnp_powertrain_share.py 2>&1 | tee data/fetched/step1_log.txt || echo "STEP 1 FAILED" >> data/fetched/step1_log.txt

      - name: Other datasets
        if: ${{ inputs.parts != 'none' }}
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python src/download_data.py ${{ inputs.parts }} 2>&1 | tee data/fetched/download_log.txt || echo "DOWNLOAD FAILED" >> data/fetched/download_log.txt

      - name: Copy small outputs into data/fetched
        run: |
          for f in data/raw/tnp_vehicle_agg.csv data/raw/tnp_trips_per_vehicle_dist.csv \
                   data/raw/public_passenger_vehicle_licenses.csv data/raw/epa_vehicles_slim.csv \
                   data/raw/tnp_trips_monthly.csv data/raw/tnp_trips_month_hour.csv \
                   data/raw/tnp_drivers_monthly.csv data/raw/eia_*.csv data/raw/brent_daily.csv \
                   data/processed/*.csv figures/*.png; do
            [ -f "$f" ] && cp "$f" data/fetched/ || true
          done
          # GitHub rejects files over 100 MB; compress anything big
          find data/fetched -name '*.csv' -size +50M -exec gzip {} \;
          ls -la data/fetched

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/fetched
          git commit -m "Fetched data $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
